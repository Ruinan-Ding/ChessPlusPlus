<div class="login-container">
  <h2>Welcome to ChessPlusPlus</h2>
  <div class="login-form">
    <div class="form-group">
      <label for="username">Enter your username (blank picks one for you):</label>
      <input 
        type="text" 
        id="username" 
        [(ngModel)]="username" 
        placeholder="Username" 
        class="form-control"
        maxlength="48"
        (keyup.enter)="login()"
      >
      <!-- Characters, not UTF-16 units: 48 lets 24 of any kind be typed, and
           login() holds it to 24 (usernameLength). -->
      <div class="char-counter" [ngClass]="{'near-limit': usernameLength > 20}">
        {{ usernameLength }}/24
      </div>
    </div>
    <button (click)="login()" class="login-button">
      Enter Lobby
    </button>
  </div>
</div>

<app-connection-dialog></app-connection-dialog>
