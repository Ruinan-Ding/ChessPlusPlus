# Both engines read the shared config. Parity fixtures and recorded-match
# playback check their agreement on every push and pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: python manage.py test game.testsuite
        env:
          DJANGO_DEBUG: 'true'
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: 'true'

      - name: Record a complete online match for the solo engine
        env:
          DJANGO_DEBUG: 'true'
          CPP_DEAL_PANELS: '1'
          E2E_PORT: '8250'
          REPLAY_OUTPUT: '../shared/recording/match.json'
          REPLAY_CONFIG: '../shared/recording/match.json'
        run: |
          python manage.py migrate --noinput
          daphne -b 127.0.0.1 -p 8250 core.asgi:application > "$RUNNER_TEMP/recording-server.log" 2>&1 &
          task_server_pid=$!
          trap 'kill "$task_server_pid"' EXIT
          python - <<'PY'
          import socket, time
          for attempt in range(100):
              try:
                  socket.create_connection(('127.0.0.1', 8250), timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError('Recording server did not start')
          PY
          python scripts/e2e/recording.py
      - uses: actions/upload-artifact@v4
        with:
          name: recorded-match
          path: |
            shared/recording/match.json
            shared/recording/match.json.expected.json
          if-no-files-found: error

  client:
    needs: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: recorded-match
          path: shared/recording
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Specs
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Production build
        run: npx ng build
