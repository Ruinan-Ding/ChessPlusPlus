name: deployment checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build and verify disposable production containers
        run: python deploy/smoke.py
